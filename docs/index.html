<!doctype html><html lang="ko"><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>컴퓨터비전 실습실</title>

<style>
:root {
  --ground: #f2f3ef;
  --surface: #ffffff;

  --ink: #1b211d;
  --muted: #5d6860;

  --bad: #c0392b;
  --hl: #fff1b8;
  --hl-ink: #6b5200;
  --cell-bg: #ffffff;

  --focus: #2f6fb0;
  --code-bg: #fbfbf8;
  --shadow: 0 1px 2px rgba(30, 40, 30, .06), 0 4px 16px rgba(30, 40, 30, .05);
  --mono: "JetBrains Mono", "Nanum Gothic Coding", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #121614; --surface: #1a201c; --surface-2: #161b18; --ink: #e5eae3; --muted: #9ba79f; --faint: #6f7b73;
    --rule: #2d3630; --orange: #f08b4f; --green: #83c366; --leaf: #3d5a31; --pos: #f08b4f; --neg: #6aa5e8;
    --ok: #6cc47a; --bad: #f07565; --hl: #4a3e10; --hl-ink: #ffe28a; --cell-bg: #1f2622; --cell-on: #e5eae3;
    --cell-on-ink: #121614; --focus: #6aa5e8; --code-bg: #151a17; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #121614; --surface: #1a201c; --surface-2: #161b18; --ink: #e5eae3; --muted: #9ba79f; --faint: #6f7b73;
  --rule: #2d3630; --orange: #f08b4f; --green: #83c366; --leaf: #3d5a31; --pos: #f08b4f; --neg: #6aa5e8;
  --ok: #6cc47a; --bad: #f07565; --hl: #4a3e10; --hl-ink: #ffe28a; --cell-bg: #1f2622; --cell-on: #e5eae3;
  --cell-on-ink: #121614; --focus: #6aa5e8; --code-bg: #151a17; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); background: var(--surface-2); padding: 20px 14px 40px; }
.brand { padding: 0 8px 14px; }
.brand b { display: block; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12.5px; }
.slidebar { display: grid; grid-template-columns: 26% 23% 26% 25%; height: 5px; margin: 10px 0 0; border-radius: 1px; overflow: hidden; }
.slidebar i:nth-child(1) { background: var(--orange); }
.slidebar i:nth-child(2) { background: var(--green); }
.slidebar i:nth-child(3) { background: var(--leaf); }
.slidebar i:nth-child(4) { background: color-mix(in srgb, var(--leaf) 40%, transparent); }
.rail h3 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 8px 6px; font-weight: 600; }
.rail a { display: grid; grid-template-columns: 44px 1fr; gap: 4px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 6px; font-size: 14px; line-height: 1.35; }
.rail a .n { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.rail a:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.rail a[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--orange); font-weight: 600; }
.rail a[aria-current="true"] .n { color: var(--orange); }
.rail a .star { color: var(--orange); font-size: 11px; margin-left: 4px; }
.mobile-nav { display: none; }

main { padding-block: 28px 80px; padding-inline: 36px; min-width: 0; }
.mod { max-width: 1280px; margin: 0 auto; }
.mod-head { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: baseline; }
.mod-num { font-family: var(--mono); font-size: 28px; color: var(--orange); font-weight: 600; letter-spacing: -.02em; }
.mod-head h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; text-wrap: balance; line-height: 1.25; }
.mod-head .src { grid-column: 2; color: var(--muted); font-size: 13px; }
.mod-head + .slidebar { margin: 14px 0 20px; height: 4px; }
.lead { max-width: 72ch; color: var(--ink); margin: 0 0 18px; }
.lead b { color: var(--orange); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: -.01em; }
.card h2 small, .card h3 small { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 6px; }
.eq { overflow-x: auto; padding: 4px 0; color: var(--ink); }
.eq mjx-container { color: var(--ink); }
.eqs { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; }
.formula-card { background: var(--surface-2); border: 1px dashed var(--rule); border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; }
.formula-card .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: 16px; align-items: start; }
.lab.wide-code { grid-template-columns: minmax(0, 1fr) minmax(360px, 470px); }
.stack { display: grid; gap: 16px; min-width: 0; }
.lab > .stack:last-child { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; }
.lab > .stack:last-child .code { max-height: 40vh; }
.tutor-panel { gap: 8px; }
.tutor-panel .tbar { padding: 5px 7px; }
.tutor-panel .tnote { min-height: 3.2em; }
.rail-toggle { position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 20; }
.app.rail-off { grid-template-columns: minmax(0, 1fr); }
.app.rail-off .rail { display: none; }
@media (max-width: 1100px) {
  .lab > .stack:last-child { position: sticky; top: auto; bottom: 0; z-index: 10; max-height: 50vh; overflow-y: auto; background: var(--ground); padding-top: 8px; box-shadow: 0 -8px 20px rgba(0, 0, 0, .12); }
  .lab > .stack:last-child .code { max-height: 16vh; }
}
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.row > * { min-width: 0; }
.col { display: grid; gap: 8px; }
.caption { font-size: 12.5px; color: var(--muted); }
.caption b { color: var(--ink); font-weight: 600; }
.note { font-size: 13.5px; background: var(--surface-2); border-left: 3px solid var(--green); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.note.warn { border-left-color: var(--orange); }
.pill { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface-2); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.pill.hot { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-family: var(--mono); }
.kv dd { margin: 0; font-family: var(--mono); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13.5px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; }
.ctl label, .ctl > span:not(.seg) { color: var(--muted); white-space: nowrap; }
.ctl output { font-family: var(--mono); min-width: 3.5ch; font-size: 13px; }
input[type="range"] { accent-color: var(--orange); width: 130px; }
select, input[type="number"], input[type="text"] { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }

/* stepper (tutor) */
.tutor { display: grid; gap: 10px; }
.tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 9px; padding: 7px 9px; }
.tbar .btn { padding: 3px 9px; font-family: var(--mono); }
.tbar input[type="range"] { flex: 1 1 140px; min-width: 100px; }
.tbar .count { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 9ch; text-align: right; }
.tnote { font-size: 13.5px; min-height: 2.8em; padding: 8px 12px; background: var(--hl); color: var(--ink); border-radius: 8px; }
.tnote b { color: var(--hl-ink); }
.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 9px; padding: 8px 0; overflow: auto; max-height: 520px; position: relative; }
.code .ln { display: grid; grid-template-columns: 34px 14px 1fr; white-space: pre; padding-right: 10px; }
.code .ln .no { color: var(--faint); text-align: right; padding-right: 4px; user-select: none; }
.code .ln .arrow { color: var(--orange); font-weight: 700; }
.code .ln.cur { background: var(--hl); }
.code .ln.cur .no { color: var(--hl-ink); font-weight: 700; }
.code .ln.done { background: color-mix(in srgb, var(--green) 8%, transparent); }
.code .kw { color: var(--green); font-weight: 600; }
.code .cm { color: var(--orange); }
.code .fn { color: var(--neg); }
.panel-title { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.watch { font-family: var(--mono); font-size: 12.5px; border-collapse: collapse; width: 100%; }
.watch td { padding: 2px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.watch td:first-child { color: var(--muted); width: 40%; }
.watch tr.chg td:last-child { background: var(--hl); }
.frames { display: grid; gap: 4px; }
.frame { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; background: var(--surface); }
.frame.top { border-color: var(--orange); box-shadow: inset 3px 0 0 var(--orange); }
.frame .fname { color: var(--neg); }
.frames .more { font-size: 12px; color: var(--muted); }

/* grid view */
.gridwrap { overflow-x: auto; max-width: 100%; }
.gv { position: relative; display: inline-grid; font-family: var(--mono); font-variant-numeric: tabular-nums; user-select: none; }
.gv .c { width: var(--cs); height: var(--cs); display: grid; place-items: center; font-size: var(--fs); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--cell-bg); position: relative; transition: background .12s; }
.gv .ax { width: var(--cs); height: var(--cs); display: grid; place-items: center; font-size: 10.5px; color: var(--faint); }
.gv .c.edge-t { border-top: 1px solid var(--rule); }
.gv .c.edge-l { border-left: 1px solid var(--rule); }
.gv .c.click { cursor: pointer; }
.gv .c.click:hover { outline: 2px solid var(--focus); outline-offset: -2px; z-index: 1; }
.gv .c.on { background: var(--cell-on); color: var(--cell-on-ink); }
.gv .c.cur { outline: 3px solid var(--orange); outline-offset: -3px; z-index: 2; }
.gv .c.win { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--orange) 18%, transparent); }
.gv .c.win2 { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--neg) 18%, transparent); }
.gv .c.del { background: color-mix(in srgb, var(--bad) 70%, var(--cell-bg)); color: #fff; }
.gv .c.dim { opacity: .35; }
.gv .c .sub { position: absolute; top: 1px; left: 3px; font-size: 9px; color: var(--faint); }
.gv .c .badge { position: absolute; bottom: 1px; right: 2px; font-size: 9.5px; font-weight: 700; }
.gv svg.ov { position: absolute; pointer-events: none; overflow: visible; }

/* image view */
.iv { display: grid; gap: 4px; min-width: 0; }
.iv canvas { image-rendering: pixelated; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--rule); background: var(--cell-bg); display: block; }
.iv .caption { display: flex; justify-content: space-between; gap: 8px; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.imgs.two { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
canvas.plot { width: 100%; height: auto; display: block; }

table.data { border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { border: 1px solid var(--rule); padding: 2px 8px; text-align: right; }
table.data th { background: var(--surface-2); color: var(--muted); font-weight: 600; }
table.data tr.cur td { background: var(--hl); }
table.data td.cur { background: var(--hl); }
.tablewrap { overflow-x: auto; max-width: 100%; }
.matrix { display: inline-grid; gap: 0; font-family: var(--mono); font-size: 12.5px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; padding: 2px 6px; vertical-align: middle; }
.matrix span { padding: 1px 6px; text-align: right; }
.kgrid { display: inline-grid; gap: 3px; }
.kgrid input { width: 58px; text-align: right; font-family: var(--mono); font-size: 13px; padding: 3px 5px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .btn { font-size: 12.5px; padding: 2px 9px; }
.presets .btn[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }
.flow .stage { flex: 1 1 150px; min-width: 130px; border: 1px solid var(--rule); background: var(--surface); padding: 8px; border-radius: 8px; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.flow .stage[aria-pressed="true"] { border-color: var(--orange); box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 30%, transparent); }
.flow .stage b { font-size: 13px; }
.flow .stage .caption { font-size: 11.5px; }
.flow .arr { align-self: center; color: var(--faint); padding: 0 4px; font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lit { font-family: var(--mono); font-size: 12.5px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--rule); }
.lit.t { background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.lit.f { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.rule-card { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; background: var(--surface); }
.rule-card.win { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.rule-card.skip { opacity: .55; }
.rule-card h4 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rule-card .why { font-size: 12.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--rule); }

.intro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.intro-grid a { text-decoration: none; color: inherit; }
.intro-grid .card { height: 100%; display: grid; gap: 4px; align-content: start; transition: border-color .15s; }
.intro-grid .card:hover { border-color: var(--orange); }
.intro-grid .n { font-family: var(--mono); color: var(--orange); font-size: 12px; }
.faq { margin: 0 0 16px; padding: 12px 18px; }
.faq > h3 { margin-bottom: 4px; }
.faq details { border-top: 1px solid var(--rule); padding: 7px 0; }
.faq details:first-of-type { border-top: 0; }
.faq summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); }
.faq summary::marker { color: var(--orange); }
.faq .a { font-size: 13.5px; margin: 6px 0 2px 18px; max-width: 80ch; }
.faq .a b { color: var(--orange); font-weight: 600; }

@media (max-width: 1100px) {
  .lab, .lab.wide-code { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .rail-toggle { display: none; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-nav { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface-2); border-bottom: 1px solid var(--rule); padding: 8px 16px; }
  .mobile-nav select { width: 100%; padding: 6px; }
  main { padding-inline: 16px; padding-block: 18px 60px; }
  .mod-num { font-size: 22px; }
  .mod-head h1 { font-size: 22px; }
}
</style>

  function insertFaq(el, items) {

  function nav() {
    const rail = document.getElementById('rail'), msel = document.getElementById('msel');
    const groups = [['2', '2강 · 영상처리'], ['3', '3강 · 에지 검출'], ['4', '4강 · 지역 특징 검출']];
    rail.append(h('a', { href: '#', 'data-id': '' }, h('span', { class: 'n' }, '—'), h('span', {}, '개요')));
    msel.append(h('option', { value: '' }, '개요'));
    for (const [ch, label] of groups) {
      rail.append(h('h3', {}, label));
      const og = h('optgroup', { label });
      for (const m of mods.filter(x => x.ch === ch)) {
        rail.append(h('a', { href: '#' + m.id, 'data-id': m.id }, h('span', { class: 'n' }, m.num), h('span', {}, m.title, m.star ? h('span', { class: 'star', title: '단계 실행기 있음' }, '●') : null)));
        og.append(h('option', { value: m.id }, `${m.num} ${m.title}`));
      }
      msel.append(og);
    }
    msel.addEventListener('change', () => (location.hash = msel.value));
  }

  function route() {
    const id = location.hash.slice(1);
    const m = mods.find(x => x.id === id);
    const main = document.getElementById('main');
    for (const [, el] of mounted) el.hidden = true;
    const key = m ? m.id : '';
    if (!mounted.has(key)) {
      const el = h('section', { class: 'mod' });
      main.append(el);
      mounted.set(key, el);
      if (m) m.mount(el, m); else intro(el);
      if (m && FAQ[m.id]) insertFaq(el, FAQ[m.id]);
      UI.typeset(el);
    }
    mounted.get(key).hidden = false;
    document.querySelectorAll('#rail a').forEach(a => a.setAttribute('aria-current', String(a.dataset.id === key)));
    document.getElementById('msel').value = key;
    document.title = m ? `${m.title} · 컴퓨터비전 실습실` : '컴퓨터비전 실습실';
    window.scrollTo(0, 0);
  }

      function harrisPts(g) { const C = CV.harris(g.map(r => r.map(v => v / 255)), { G: CV.gaussKernel2D(1.5), border: 'replicate' }).C; return CV.localMax(C, 0.05 * Math.max(...C.flat()), 8).map(([y, x]) => ({ y, x, s: 1.5 })); }
      function siftPts(g) { return CV.siftKeypoints(CV.siftPyramid(g, 2), 0.02 * 255, 10).map(k => ({ y: k.Y, x: k.X, s: k.s })); }
      function surfPts(g) {
        const f = g.map(r => r.map(v => v / 255)), H = f.length, W = f[0].length, ii = CV.integral(f), out2 = [];
        const sizes = CV.surfSizes(0), maps = sizes.map(L => CV.surfDet(ii, L, H, W)), mx = Math.max(...maps.flat(2));
        for (let l = 1; l <= 2; l++) { const b = (sizes[l + 1] - 1) / 2 + 1; for (let y = b; y < H - b; y++) for (let x = b; x < W - b; x++) { const c = maps[l][y][x]; if (c < 0.01 * mx) continue; let ok = true; for (let d = -1; d <= 1 && ok; d++) for (let j = -1; j <= 1 && ok; j++) for (let a = -1; a <= 1; a++) if ((d || j || a) && maps[l + d][y + j][x + a] >= c) { ok = false; break; } if (ok) out2.push({ y, x, s: 1.2 * sizes[l] / 9 }); } }
        return out2;
      }
      const DET = [['해리스 (단일 스케일)', harrisPts, '--neg'], ['SIFT', siftPts, '--orange'], ['SURF', surfPts, '--ok']];
      function run() {
        const g = gray(), Wp = CV.warp(g, deg, scl), hb = Wp.img.length, wb = Wp.img[0].length, res = [];
        for (const [nm, fn, colr] of DET) {
          const [A, ta] = ms(() => fn(g)), B = fn(Wp.img);
          const mp = A.map(p => ({ ...p, m: Wp.map(p.y, p.x) })).filter(p => p.m[0] >= 4 && p.m[1] >= 4 && p.m[0] < hb - 4 && p.m[1] < wb - 4);
          const tol = 1.5 + 0.5 / scl;
          const hit = mp.filter(p => B.some(q => (q.y - p.m[0]) ** 2 + (q.x - p.m[1]) ** 2 <= tol * tol));
          res.push({ nm, colr, nA: A.length, nB: B.length, n: mp.length, hit: hit.length, rate: mp.length ? hit.length / mp.length : 0, ta });
        }
        UI.plot(cvs, { w: 460, h: 190, x: [-0.5, 2.5], y: [0, 100], xticks: [0, 1, 2], xfmt: v => res[v] ? res[v].nm.split(' ')[0] : '', series: res.map((r, i) => ({ type: 'bar', data: [[i, r.rate * 100]], color: r.colr, bw: 70 })), yfmt: v => v + '%' });
        out.replaceChildren(UI.dataTable(['검출기', '원래 영상 점', '변환 영상 점', '반복', '반복률', '시간'], res.map(r => [r.nm, r.nA, r.nB, `${r.hit}/${r.n}`, (r.rate * 100).toFixed(0) + '%', r.ta.toFixed(0) + ' ms'])));
      }
      UI.onImage(run);
      root.append(
        h('div', { class: 'card' }, h('h3', {}, '불변성 한눈에 보기'), UI.dataTable(['검출기', '특징 가능성', '이동', '회전', '스케일', '속도 (교재·Bay2008)'], rows.map(r => [h('b', {}, r[0]), r[1], '✔', r[3], r[4], r[5]])),
          h('p', { class: 'caption' }, '이 장의 검출기는 모두 위치·스케일까지만 정합니다. 방향과 특징 벡터(기술자)는 6장에서 다룹니다. 어파인(비스듬히 본) 변환까지 불변인 검출기는 [Mikolajczyk2005b]에 비교되어 있습니다.')),
        h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', {}, '직접 해 보는 반복률 실험'),
          h('div', { class: 'controls' }, UI.imagePicker(), UI.slider({ label: '회전', min: 0, max: 90, step: 5, value: deg, id: 'dc-r', fmt: v => v + '°', oninput: v => { deg = v; run(); } }), UI.slider({ label: '스케일', min: 0.5, max: 1, step: 0.05, value: scl, id: 'dc-s', fmt: v => v.toFixed(2), oninput: v => { scl = v; run(); } })),
          h('div', { class: 'row', style: { marginTop: '10px' } }, h('div', { class: 'col', style: { flex: '1 1 420px' } }, cvs), h('div', { class: 'col', style: { flex: '1 1 380px' } }, out)),
          h('p', { class: 'caption' }, '간단히 하려고 위치만 비교했습니다(허용 오차 약 1.5~2.5화소). 논문의 반복률은 검출 영역의 겹침 비율까지 봅니다. 영상과 변환에 따라 순위가 바뀌므로 교재 말대로 “손수 실험하고 판단”해야 합니다.')),
        h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', {}, '참고 논문'),
          h('ul', { class: 'caption', style: { margin: 0, paddingLeft: '18px' } },
            h('li', {}, '[Tuytelaars2007] T. Tuytelaars, K. Mikolajczyk, “Local invariant feature detectors: a survey,” Foundations and Trends in Computer Graphics and Vision 3(3), 177–280 — 튜토리얼'),
            h('li', {}, '[Schmid2000] C. Schmid et al., “Evaluation of interest point detectors,” IJCV 37(2), 151–172'),
            h('li', {}, '[Mikolajczyk2005b] K. Mikolajczyk et al., “A comparison of affine region detectors,” IJCV 65(1-2), 43–72'),
            h('li', {}, '[Miksik2012] O. Miksik, K. Mikolajczyk, “Evaluation of local detectors and descriptors for fast feature matching,” ICPR, 2681–2684'),
            h('li', {}, '[Aanes2012] H. Aanæs et al., “Interesting interest points,” IJCV 97, 18–35'))));
      run();
    },
  });
})();

APP.start();
</script>
